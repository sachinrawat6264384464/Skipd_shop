services:
  # 1. FastAPI Web Server
  - type: web
    name: skipd-commerce-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: skipd-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: skipd-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false

  # 2. Celery Background Worker Service
  - type: worker
    name: skipd-celery-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skipd-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: skipd-redis
          property: connectionString

# 3. Redis In-Memory Message Broker
  - type: redis
    name: skipd-redis
    ipAllowList: [] # internal access only
    plan: free

# 4. PostgreSQL Database
databases:
  - name: skipd-postgres
    databaseName: skipd_db
    user: skipd_user
    plan: free
